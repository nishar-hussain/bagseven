name: bagseven

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bagseven
      POSTGRES_PASSWORD: bagseven
      POSTGRES_DB: bagseven
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bagseven -d bagseven"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr PLAIN://0.0.0.0:9092
      - --advertise-kafka-addr PLAIN://localhost:9092
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
    ports:
      - "9092:9092"
      - "9644:9644"

volumes:
  pgdata:
